version: "3.9"

services:
  backend:
    build: .
    container_name: resume_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    env_file:
      - ./my_site/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - media_volume:/app/media

  worker:
    build: .
    container_name: resume_worker
    command: celery -A my_site.workers.celery_app.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - ./my_site/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - media_volume:/app/media

  postgres:
    image: postgres:16-alpine
    container_name: resume_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_db
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resume_redis
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: resume_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - media_volume:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media_volume:
