version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume_db
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: resume_redis
    restart: unless-stopped
    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resume_backend
    restart: unless-stopped
    env_file:
      - ./my_site/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - media_data:/app/media
    networks:
      - app_net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resume_worker
    restart: unless-stopped
    command: celery -A my_site.workers.celery_app.celery_app worker --loglevel=info
    env_file:
      - ./my_site/.env
    depends_on:
      - postgres
      - redis
    volumes:
      - media_data:/app/media
    networks:
      - app_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: resume_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      - backend
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    container_name: resume_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
    networks:
      - app_net

volumes:
  postgres_data:
  media_data:

networks:
  app_net: